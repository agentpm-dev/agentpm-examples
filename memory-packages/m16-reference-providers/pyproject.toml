[project]
name = "agentpm-examples-m16-reference-providers"
version = "0.1.0"
description = "AgentPM Harness M16 MemoryRuntime reference providers"
requires-python = ">=3.10"
dependencies = ["agentpm>=0.1.15"]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.2.0"]
redis = ["redis>=5.0.0"]
test = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["providers/python"]
